# Local MongoDB and n8n services. The app itself runs as separate local processes (see README).
services:
  mongodb:
    image: mongo:7
    container_name: mailpilot-mongodb
    restart: unless-stopped
    ports:
      # Bound to localhost only so the unauthenticated dev DB is not exposed to your network.
      - "127.0.0.1:27017:27017"
    volumes:
      - mailpilot_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: mailpilot-n8n
    restart: unless-stopped
    ports:
      # Bound to localhost only so n8n is not exposed publicly.
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENCRYPTION_KEY=mailpilot_n8n_secure_encryption_key_change_in_prod
    volumes:
      - mailpilot_n8n_data:/home/node/.n8n

volumes:
  mailpilot_mongo_data:
  mailpilot_n8n_data:
